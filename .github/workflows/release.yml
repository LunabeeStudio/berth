name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - Package.swift
      - Sources/BerthCore/Version.swift

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      - name: Package
        run: scripts/release/package.sh 0.0.0 dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: berth-macos-universal
          path: dist/*
