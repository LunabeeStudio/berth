name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - Package.swift
      - Sources/BerthCore/Version.swift

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      - name: Package
        run: scripts/release/package.sh 0.0.0 dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: berth-macos-arm64
          path: dist/*
