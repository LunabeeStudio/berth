name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - Package.swift
      - Sources/BerthCore/Version.swift

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          plugin="$(plutil -extract version raw claude-plugin/.claude-plugin/plugin.json)"
          marketplace="$(plutil -extract plugins.0.version raw .claude-plugin/marketplace.json)"
          if [[ "$plugin" != "$version" || "$marketplace" != "$version" ]]; then
            echo "::error::tag is $version but plugin.json is $plugin and marketplace.json is $marketplace"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Package
        run: scripts/release/package.sh "${{ steps.version.outputs.value }}" dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: berth-macos-arm64
          path: dist/*

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: berth-macos-arm64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
